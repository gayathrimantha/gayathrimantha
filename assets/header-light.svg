    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E4E6E9"/></pattern>
    <radialGradient id="fade" cx="0.78" cy="0.5" r="0.45"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="1200" height="400" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3A6BEA" stop-opacity="0.16"/><stop offset="1" stop-color="#3A6BEA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="400" rx="16" fill="#FBFBFA"/>
