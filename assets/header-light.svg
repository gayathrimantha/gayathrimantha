  <text xml:space="preserve" x="80" y="334" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.4" fill="#5E646D">WEB<tspan fill="#D9DCE0">   /   </tspan>iOS<tspan fill="#D9DCE0">   /   </tspan>ANDROID<tspan fill="#D9DCE0">   /   </tspan>WEARABLES<tspan fill="#D9DCE0">   /   </tspan>BACKEND</text>

